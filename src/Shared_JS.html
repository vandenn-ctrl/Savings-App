<script>
  // --- Session storage helpers -----------------------------------------
  function getToken() { return localStorage.getItem('fs_token'); }
  function getRole() { return localStorage.getItem('fs_role'); }
  function getDisplayName() { return localStorage.getItem('fs_displayName'); }
  function getAvatar() { return localStorage.getItem('fs_avatar') || '🙂'; }
  function getTheme() { return localStorage.getItem('fs_theme') || ''; }

  function setSession(session) {
    localStorage.setItem('fs_token', session.token);
    localStorage.setItem('fs_role', session.role);
    localStorage.setItem('fs_displayName', session.displayName);
    localStorage.setItem('fs_avatar', session.avatar || '🙂');
    localStorage.setItem('fs_theme', session.theme || '');
    applyTheme(session.theme || '');
  }

  function setAvatar(avatar) {
    localStorage.setItem('fs_avatar', avatar);
  }

  function setTheme(themeStr) {
    localStorage.setItem('fs_theme', themeStr || '');
    applyTheme(themeStr || '');
  }

  function clearSession() {
    localStorage.removeItem('fs_token');
    localStorage.removeItem('fs_role');
    localStorage.removeItem('fs_displayName');
    localStorage.removeItem('fs_avatar');
    localStorage.removeItem('fs_theme');
    applyTheme('');
  }

  // --- Per-user theme (accent color + solid/gradient background) ----------
  function darkenHex_(hex, amount) {
    var num = parseInt(String(hex || '').replace('#', ''), 16);
    if (isNaN(num)) return hex;
    var r = Math.max(0, (num >> 16) - amount);
    var g = Math.max(0, ((num >> 8) & 0xff) - amount);
    var b = Math.max(0, (num & 0xff) - amount);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  /** Applies a theme JSON string (or '' to reset) as CSS custom property overrides, plus the tab-label toggle. */
  function applyTheme(themeStr) {
    var root = document.documentElement.style;
    var theme = null;
    try { theme = themeStr ? JSON.parse(themeStr) : null; } catch (e) { theme = null; }

    if (!theme) {
      ['--color-primary', '--color-primary-dark', '--color-bg'].forEach(function (p) {
        root.removeProperty(p);
      });
      document.body.classList.remove('show-tab-labels');
      return;
    }

    if (theme.accent) {
      root.setProperty('--color-primary', theme.accent);
      root.setProperty('--color-primary-dark', darkenHex_(theme.accent, 30));
    }
    if (theme.bgMode === 'gradient' && theme.bgFrom && theme.bgTo) {
      root.setProperty('--color-bg', 'linear-gradient(135deg, ' + theme.bgFrom + ', ' + theme.bgTo + ')');
    } else if (theme.bgFrom) {
      root.setProperty('--color-bg', theme.bgFrom);
    }
    document.body.classList.toggle('show-tab-labels', !!theme.showTabLabels);
  }

  // --- Error banner -------------------------------------------------------
  function showError(message) {
    var el = document.getElementById('global-error-banner');
    if (!el) { console.error(message); return; }
    el.textContent = message;
    el.style.display = 'block';
  }

  function hideError() {
    var el = document.getElementById('global-error-banner');
    if (el) el.style.display = 'none';
  }

  // --- Button busy state ---------------------------------------------------
  /**
   * Disables a button and swaps in a "Working…" label while an async call
   * is in flight, restoring its original label/state afterward. button is
   * optional -- callers that don't have one just skip this.
   */
  function setButtonBusy(button, busy) {
    if (!button) return;
    if (busy) {
      if (button.dataset.originalLabel === undefined) button.dataset.originalLabel = button.textContent;
      button.disabled = true;
      button.textContent = 'Working…';
    } else {
      button.disabled = false;
      if (button.dataset.originalLabel !== undefined) button.textContent = button.dataset.originalLabel;
    }
  }

  // --- google.script.run wrappers -----------------------------------------
  /**
   * Calls a server function that does NOT require a session token
   * (e.g. login). args is an array of positional arguments. button, if
   * given, is disabled with a "Working…" label for the duration of the call.
   */
  function callPublic(fnName, args, onSuccess, onError, button) {
    setButtonBusy(button, true);
    google.script.run
      .withSuccessHandler(function (result) {
        setButtonBusy(button, false);
        hideError();
        if (onSuccess) onSuccess(result);
      })
      .withFailureHandler(function (err) {
        setButtonBusy(button, false);
        var msg = (err && err.message) ? err.message : String(err);
        showError(msg);
        if (onError) onError(err);
      })[fnName].apply(null, args || []);
  }

  /**
   * Calls a server function whose first parameter is the session token.
   * Automatically redirects to the login view on an expired/invalid session.
   * button, if given, is disabled with a "Working…" label for the duration.
   */
  function callAuthed(fnName, args, onSuccess, onError, button) {
    setButtonBusy(button, true);
    var token = getToken();
    var fullArgs = [token].concat(args || []);
    google.script.run
      .withSuccessHandler(function (result) {
        setButtonBusy(button, false);
        hideError();
        if (onSuccess) onSuccess(result);
      })
      .withFailureHandler(function (err) {
        setButtonBusy(button, false);
        var msg = (err && err.message) ? err.message : String(err);
        if (msg.indexOf('Session expired') !== -1 || msg.indexOf('Not logged in') !== -1 ||
            msg.indexOf('Account not found or disabled') !== -1) {
          clearSession();
          if (typeof showLoginView === 'function') showLoginView();
        }
        showError(msg);
        if (onError) onError(err);
      })[fnName].apply(null, fullArgs);
  }

  // --- In-page modal (replaces window.prompt/confirm) ----------------------
  var _modalResolve = null;
  var _modalFieldKeys = [];

  /**
   * Shows the shared modal and resolves a Promise with { confirmed, values }
   * once the user clicks Confirm or Cancel. values is keyed by each field's
   * "key". options: { title, bodyText, confirmLabel, fields: [{
   *   key, label, type ('text'/'number'/'password'/'select'/'color'), placeholder,
   *   value -- pre-fills the field (selects the matching <option> for 'select'),
   *   options: [{value,label}] (for type:'select'),
   *   showWhen: {key, values} -- only visible when that other field's
   *             current value is in `values` (used for the type-dependent
   *             fields in the admin "enter transaction" form)
   * }] }
   */
  function showModal(options) {
    return new Promise(function (resolve) {
      document.getElementById('modal-title').textContent = options.title || '';

      var bodyEl = document.getElementById('modal-body');
      if (options.bodyText) {
        bodyEl.textContent = options.bodyText;
        bodyEl.classList.remove('hidden');
      } else {
        bodyEl.classList.add('hidden');
      }

      var fields = options.fields || [];
      _modalFieldKeys = fields.map(function (f) { return f.key; });

      document.getElementById('modal-fields').innerHTML = fields.map(function (f) {
        var label = '<label for="modal-field-' + f.key + '">' + escapeHtml(f.label) + '</label>';
        var control;
        if (f.type === 'select') {
          var opts = (f.options || []).map(function (o) {
            var selectedAttr = (f.value !== undefined && o.value === f.value) ? ' selected' : '';
            return '<option value="' + escapeHtml(o.value) + '"' + selectedAttr + '>' + escapeHtml(o.label) + '</option>';
          }).join('');
          control = '<select id="modal-field-' + f.key + '">' + opts + '</select>';
        } else {
          control = '<input id="modal-field-' + f.key + '" type="' + (f.type || 'text') +
            '" value="' + escapeHtml(f.value || '') + '" placeholder="' + escapeHtml(f.placeholder || '') + '" />';
        }
        return '<div id="modal-field-wrap-' + f.key + '">' + label + control + '</div>';
      }).join('');

      document.getElementById('modal-confirm-btn').textContent = options.confirmLabel || 'Confirm';
      document.getElementById('modal-overlay').classList.remove('hidden');

      function applyVisibility() {
        fields.forEach(function (f) {
          if (!f.showWhen) return;
          var controllerEl = document.getElementById('modal-field-' + f.showWhen.key);
          var visible = controllerEl && f.showWhen.values.indexOf(controllerEl.value) !== -1;
          document.getElementById('modal-field-wrap-' + f.key).classList.toggle('hidden', !visible);
        });
      }

      fields.forEach(function (f) {
        var el = document.getElementById('modal-field-' + f.key);
        if (f.type === 'select') el.addEventListener('change', applyVisibility);
        el.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            modalConfirm_();
          } else if (e.key === 'Escape') {
            e.preventDefault();
            modalCancel_();
          }
        });
      });
      applyVisibility();

      if (fields.length > 0) {
        setTimeout(function () {
          var el = document.getElementById('modal-field-' + fields[0].key);
          if (el) el.focus();
        }, 50);
      }

      _modalResolve = resolve;
    });
  }

  function modalConfirm_() {
    var values = {};
    _modalFieldKeys.forEach(function (key) {
      var el = document.getElementById('modal-field-' + key);
      values[key] = el ? el.value : '';
    });
    document.getElementById('modal-overlay').classList.add('hidden');
    if (_modalResolve) {
      var resolve = _modalResolve;
      _modalResolve = null;
      resolve({ confirmed: true, values: values });
    }
  }

  function modalCancel_() {
    document.getElementById('modal-overlay').classList.add('hidden');
    if (_modalResolve) {
      var resolve = _modalResolve;
      _modalResolve = null;
      resolve({ confirmed: false, values: {} });
    }
  }

  function formatMoney(amount) {
    var n = Number(amount || 0);
    return '$' + n.toFixed(2);
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /** Rounds a rough axis-tick step up to a "nice" 1/2/5x10^n value -- shared by every SVG chart. */
  function niceChartStep_(roughStep) {
    if (roughStep <= 0) return 1;
    var mag = Math.pow(10, Math.floor(Math.log10(roughStep)));
    var norm = roughStep / mag;
    var niceNorm = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
    return niceNorm * mag;
  }

  function formatChartTick_(v) {
    if (v >= 1000) return '$' + (v / 1000).toLocaleString(undefined, { maximumFractionDigits: 1 }) + 'K';
    return '$' + v.toLocaleString();
  }

  /**
   * Bumped by hand with every push, so a quick glance at the "i" badge
   * (present on every page, including Login) tells you whether a deploy
   * actually took -- if you just pushed and this still shows the old
   * date/notes, the deploy or the browser cache is stale, not the
   * underlying feature.
   */
  var APP_VERSION_INFO = {
    version: 'v1.13',
    date: '2026-07-06',
    notes: [
      'Version badge moved to an "i" icon, present on every page (not just Login)',
      'Admin Home: one combined savings chart + one investment-earnings chart, all kids at once',
      'Admin FAB: two fixed buttons (+/- transactions, check approvals w/ badge) + hamburger for the rest',
      'Removed the Home tab Actions button grid',
      'Savings chart now shows past + current month (weekly points) with an explicit "interest earned" figure',
      'New separate Investment earnings chart on the kid\'s Investments tab',
      'Savings request compacted into a single +/- button',
      'Admin can edit a buy/sell\'s price after the fact, not just quantity',
      'Communicate tab: Inbox / Sent / Drafts / Compose',
      'Kids can message their parent outside of a transaction'
    ]
  };

  function showVersionInfo() {
    showModal({
      title: 'What\'s new -- ' + APP_VERSION_INFO.version + ' (' + APP_VERSION_INFO.date + ')',
      bodyText: APP_VERSION_INFO.notes.map(function (n) { return '- ' + n; }).join('\n'),
      fields: [],
      confirmLabel: 'Close'
    });
  }
</script>
