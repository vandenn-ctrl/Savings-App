<style>
  :root {
    --color-bg: #f4f6f8;
    --color-card: #ffffff;
    --color-text: #1f2933;
    --color-muted: #52606d;
    --color-primary: #2f6f4f;
    --color-primary-dark: #234f38;
    --color-danger: #b3261e;
    --color-border: #dde3e8;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
  }

  .app-shell { max-width: 880px; margin: 0 auto; padding: 16px; }

  .card {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }

  .card h2, .card h3 { margin-top: 0; }

  .stat-row { display: flex; flex-wrap: wrap; gap: 16px; }
  .stat-tile { flex: 1 1 160px; }
  .stat-tile .label { font-size: 13px; color: var(--color-muted); }
  .stat-tile .value { font-size: 24px; font-weight: 600; }

  label { display: block; font-size: 13px; color: var(--color-muted); margin-bottom: 4px; }

  input, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 12px;
  }

  button {
    background: var(--color-primary);
    color: white;
    border: none;
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: var(--color-primary-dark); }
  button.secondary { background: var(--color-muted); }
  button.danger { background: var(--color-danger); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--color-border); }
  th { color: var(--color-muted); font-weight: 600; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge-PENDING { background: #fff3cd; color: #8a6d1d; }
  .badge-APPROVED { background: #d9f2e3; color: #1e6b42; }
  .badge-REJECTED { background: #fbdede; color: #97281f; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button { background: transparent; color: var(--color-text); border: 1px solid var(--color-border); }
  .tabs button.active { background: var(--color-primary); color: white; border-color: var(--color-primary); }

  .error-banner {
    background: #fbdede;
    color: #97281f;
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 12px;
    display: none;
  }

  .hidden { display: none !important; }
  .muted { color: var(--color-muted); font-size: 13px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > * { flex: 1 1 200px; }
</style>
