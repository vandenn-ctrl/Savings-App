<style>
  :root {
    --color-bg: #f4f6f8;
    --color-card: #ffffff;
    --color-text: #1f2933;
    --color-muted: #52606d;
    --color-primary: #2f6f4f;
    --color-primary-dark: #234f38;
    --color-danger: #b3261e;
    --color-border: #dde3e8;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
  }

  .app-shell { max-width: 880px; margin: 0 auto; padding: 16px; }

  .card {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }

  .card h2, .card h3 { margin-top: 0; }

  .stat-row { display: flex; flex-wrap: wrap; gap: 16px; }
  .stat-tile { flex: 1 1 160px; }
  .stat-tile .label { font-size: 13px; color: var(--color-muted); }
  .stat-tile .value { font-size: 24px; font-weight: 600; }

  label { display: block; font-size: 13px; color: var(--color-muted); margin-bottom: 4px; }

  input, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 12px;
  }

  button {
    background: var(--color-primary);
    color: white;
    border: none;
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: var(--color-primary-dark); }
  button.secondary { background: var(--color-muted); }
  button.danger { background: var(--color-danger); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--color-border); }
  th { color: var(--color-muted); font-weight: 600; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge-PENDING { background: #fff3cd; color: #8a6d1d; }
  .badge-APPROVED { background: #d9f2e3; color: #1e6b42; }
  .badge-REJECTED { background: #fbdede; color: #97281f; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button { background: transparent; color: var(--color-text); border: 1px solid var(--color-border); }
  .tabs button.active { background: var(--color-primary); color: white; border-color: var(--color-primary); }

  .error-banner {
    background: #fbdede;
    color: #97281f;
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 12px;
    display: none;
  }

  .hidden { display: none !important; }
  .muted { color: var(--color-muted); font-size: 13px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > * { flex: 1 1 200px; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 27, 33, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 1000;
  }
  .modal-card {
    background: var(--color-card);
    border-radius: var(--radius);
    padding: 20px;
    max-width: 420px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-card h3 { margin-top: 0; }
  .modal-body {
    white-space: pre-wrap;
    font-size: 14px;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 14px;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  .avatar-badge {
    width: 44px;
    height: 44px;
    min-width: 44px;
    border-radius: 50%;
    background: var(--color-bg);
    border: 2px solid var(--color-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
  }
  .avatar-badge:hover { border-color: var(--color-primary-dark); }

  .user-badge { display: flex; align-items: center; gap: 10px; }
  .user-badge .user-name { font-weight: 600; font-size: 15px; }
  .user-badge .user-role { font-size: 12px; color: var(--color-muted); }

  .top-bar-role-pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .top-bar-role-pill.role-ADMIN { background: #ffe4b8; color: #7a4a00; }
  .top-bar-role-pill.role-KID { background: #d9e8ff; color: #1c4c8c; }
</style>
