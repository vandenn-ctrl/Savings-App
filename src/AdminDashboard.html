<div id="view-admin" class="app-shell hidden">
  <div class="tabs">
    <button id="admin-tab-btn-approvals" class="active" onclick="adminShowTab('approvals')">Approvals</button>
    <button id="admin-tab-btn-kids" onclick="adminShowTab('kids')">Kids</button>
    <button id="admin-tab-btn-rates" onclick="adminShowTab('rates')">Rates</button>
    <button id="admin-tab-btn-users" onclick="adminShowTab('users')">Users</button>
  </div>

  <div id="admin-tab-approvals">
    <div class="card">
      <h2>Pending approvals</h2>
      <table>
        <thead><tr><th>Requested</th><th>Kid</th><th>Type</th><th>Details</th><th>Actions</th></tr></thead>
        <tbody id="admin-pending-rows"></tbody>
      </table>
    </div>
  </div>

  <div id="admin-tab-kids" class="hidden">
    <div class="card">
      <h2>Kids</h2>
      <table>
        <thead><tr><th>Name</th><th>Savings</th><th>Investments</th><th>Net worth</th><th></th></tr></thead>
        <tbody id="admin-kids-rows"></tbody>
      </table>
    </div>
  </div>

  <div id="admin-tab-rates" class="hidden">
    <div class="card">
      <h3>Global savings rate</h3>
      <p class="muted">Current: <span id="admin-current-rate">--</span>% APY (effective <span id="admin-current-rate-date">--</span>)</p>
      <label for="admin-global-rate">New annual rate (e.g. 0.03 for 3%)</label>
      <input id="admin-global-rate" type="number" min="0" max="1" step="0.001" />
      <label for="admin-global-rate-date">Effective from</label>
      <input id="admin-global-rate-date" type="date" />
      <button onclick="submitGlobalRate(this)">Update global rate</button>
    </div>
    <div class="card">
      <h3>Per-kid override</h3>
      <label for="admin-override-user">Kid</label>
      <select id="admin-override-user"></select>
      <label for="admin-override-rate">Override annual rate (blank to clear)</label>
      <input id="admin-override-rate" type="number" min="0" max="1" step="0.001" />
      <button onclick="submitRateOverride(this)">Set override</button>
    </div>
  </div>

  <div id="admin-tab-users" class="hidden">
    <div class="card">
      <h3>Create account</h3>
      <div class="row">
        <div>
          <label for="admin-new-username">Username</label>
          <input id="admin-new-username" type="text" />
        </div>
        <div>
          <label for="admin-new-displayname">Display name</label>
          <input id="admin-new-displayname" type="text" />
        </div>
      </div>
      <div class="row">
        <div>
          <label for="admin-new-passcode">Initial access code</label>
          <input id="admin-new-passcode" type="text" />
        </div>
        <div>
          <label for="admin-new-email">Email (for statements)</label>
          <input id="admin-new-email" type="email" />
        </div>
      </div>
      <label for="admin-new-role">Role</label>
      <select id="admin-new-role">
        <option value="KID">Kid</option>
        <option value="ADMIN">Admin</option>
      </select>
      <button onclick="submitCreateAccount(this)">Create account</button>
    </div>

    <div class="card">
      <h3>All users</h3>
      <table>
        <thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="admin-users-rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  var _adminUsersCache = [];
  var _adminPendingCache = [];

  function adminShowTab(name) {
    ['approvals', 'kids', 'rates', 'users'].forEach(function (t) {
      document.getElementById('admin-tab-' + t).classList.toggle('hidden', t !== name);
      document.getElementById('admin-tab-btn-' + t).classList.toggle('active', t === name);
    });
    if (name === 'approvals') loadPendingApprovals();
    if (name === 'kids') loadKidsOverview();
    if (name === 'rates') loadRatesTab();
    if (name === 'users') loadUsersTab();
  }

  function loadAdminDashboard() {
    loadPendingApprovals();
  }

  function loadPendingApprovals() {
    callAuthed('listPendingTransactions', [], function (pending) {
      _adminPendingCache = pending;
      var rows = pending.map(function (t) {
        var details = t.Ticker
          ? (t.Ticker + ' x ' + t.Quantity + ' (@ ' + formatMoney(t.PriceAtRequest) + ')')
          : formatMoney(t.Amount);
        return '<tr><td>' + escapeHtml(t.RequestedAt) + '</td><td>' + escapeHtml(t.displayName || t.UserId) +
          '</td><td>' + escapeHtml(t.Type) + '</td><td>' + escapeHtml(details) + '</td><td>' +
          '<button onclick="approveTxn(this, \'' + t.TransactionId + '\')">Approve</button> ' +
          '<button class="danger" onclick="rejectTxn(this, \'' + t.TransactionId + '\')">Reject</button></td></tr>';
      }).join('');
      document.getElementById('admin-pending-rows').innerHTML = rows || '<tr><td colspan="5" class="muted">Nothing pending.</td></tr>';
    });
  }

  /** Builds a human-readable multi-line summary of a pending transaction, for the approve/reject prompts. */
  function buildTransactionDetailText_(t) {
    var lines = [
      'Kid: ' + (t.displayName || t.UserId),
      'Type: ' + t.Type,
      'Requested: ' + t.RequestedAt
    ];
    if (t.Ticker) {
      lines.push('Ticker: ' + t.Ticker, 'Quantity: ' + t.Quantity, 'Price at request: ' + formatMoney(t.PriceAtRequest));
    }
    lines.push('Amount: ' + formatMoney(t.Amount));
    if (t.Notes) lines.push('Kid\'s note: ' + t.Notes);
    return lines.join('\n');
  }

  function findPendingTxn_(txnId) {
    for (var i = 0; i < _adminPendingCache.length; i++) {
      if (_adminPendingCache[i].TransactionId === txnId) return _adminPendingCache[i];
    }
    return null;
  }

  function approveTxn(button, txnId) {
    var txn = findPendingTxn_(txnId);
    showModal({
      title: 'Approve transaction',
      bodyText: txn ? buildTransactionDetailText_(txn) : '',
      fields: [{ key: 'comment', label: 'Optional comment' }],
      confirmLabel: 'Approve'
    }).then(function (result) {
      if (!result.confirmed) return;
      callAuthed('approveTransaction', [txnId, result.values.comment], function () { loadPendingApprovals(); }, null, button);
    });
  }

  function rejectTxn(button, txnId) {
    var txn = findPendingTxn_(txnId);
    showModal({
      title: 'Reject transaction',
      bodyText: txn ? buildTransactionDetailText_(txn) : '',
      fields: [{ key: 'reason', label: 'Optional reason' }],
      confirmLabel: 'Reject'
    }).then(function (result) {
      if (!result.confirmed) return;
      callAuthed('rejectTransaction', [txnId, result.values.reason], function () { loadPendingApprovals(); }, null, button);
    });
  }

  function loadKidsOverview() {
    callAuthed('listUsers', [], function (users) {
      _adminUsersCache = users;
      var kids = users.filter(function (u) { return u.role === 'KID'; });
      if (kids.length === 0) {
        document.getElementById('admin-kids-rows').innerHTML = '<tr><td colspan="5" class="muted">No kids yet.</td></tr>';
        return;
      }
      var rowsHtml = [];
      var remaining = kids.length;
      kids.forEach(function (kid) {
        callAuthed('getUserSummary', [kid.userId], function (summary) {
          rowsHtml.push({
            order: kid.userId,
            html: '<tr><td>' + escapeHtml(kid.displayName) + '</td><td>' + formatMoney(summary.savings.cashBalance) +
              '</td><td>' + formatMoney(summary.holdingsValue) + '</td><td>' + formatMoney(summary.netWorth) + '</td>' +
              '<td><button onclick="adminEnterTransaction(this, \'' + kid.userId + '\', \'' + escapeHtml(kid.displayName) + '\')">Enter transaction</button> ' +
              '<button class="secondary" onclick="promptResetPasscode(this, \'' + kid.userId + '\')">Reset code</button></td></tr>'
          });
          remaining--;
          if (remaining === 0) {
            document.getElementById('admin-kids-rows').innerHTML = rowsHtml.map(function (r) { return r.html; }).join('');
          }
        });
      });
    });
  }

  /** Admin enters a transaction directly on a kid's behalf -- auto-approved, no separate review needed. */
  function adminEnterTransaction(button, userId, displayName) {
    showModal({
      title: 'Enter transaction for ' + displayName,
      bodyText: 'This is recorded as already approved -- it takes effect immediately.',
      fields: [
        {
          key: 'type', label: 'Type', type: 'select', options: [
            { value: 'SAVINGS_DEPOSIT', label: 'Savings deposit' },
            { value: 'SAVINGS_WITHDRAWAL', label: 'Savings withdrawal' },
            { value: 'INVEST_BUY', label: 'Investment buy' },
            { value: 'INVEST_SELL', label: 'Investment sell' }
          ]
        },
        { key: 'amount', label: 'Amount', type: 'number', showWhen: { key: 'type', values: ['SAVINGS_DEPOSIT', 'SAVINGS_WITHDRAWAL'] } },
        { key: 'ticker', label: 'Ticker', showWhen: { key: 'type', values: ['INVEST_BUY', 'INVEST_SELL'] } },
        { key: 'quantity', label: 'Quantity', type: 'number', showWhen: { key: 'type', values: ['INVEST_BUY', 'INVEST_SELL'] } },
        { key: 'note', label: 'Optional note' }
      ],
      confirmLabel: 'Enter transaction'
    }).then(function (result) {
      if (!result.confirmed) return;
      var v = result.values;

      if (v.type === 'SAVINGS_DEPOSIT' || v.type === 'SAVINGS_WITHDRAWAL') {
        if (!v.amount || Number(v.amount) <= 0) { showError('Enter a valid amount.'); return; }
        callAuthed('adminRecordSavingsTransaction', [userId, v.type, parseFloat(v.amount), v.note], function () {
          showError('Transaction recorded.');
          loadKidsOverview();
        }, null, button);
      } else {
        if (!v.ticker || !v.quantity || Number(v.quantity) <= 0) { showError('Enter a ticker and quantity.'); return; }
        callAuthed('adminRecordInvestmentTransaction', [userId, v.type, v.ticker, parseFloat(v.quantity), v.note], function () {
          showError('Transaction recorded.');
          loadKidsOverview();
        }, null, button);
      }
    });
  }

  function promptResetPasscode(button, userId) {
    showModal({
      title: 'Reset access code',
      fields: [{ key: 'newCode', label: 'New access code for this user' }],
      confirmLabel: 'Reset'
    }).then(function (result) {
      if (!result.confirmed || !result.values.newCode) return;
      callAuthed('resetPasscode', [userId, result.values.newCode], function () {
        showError('Access code reset.');
      }, null, button);
    });
  }

  function loadRatesTab() {
    callAuthed('getGlobalRateInfo', [], function (info) {
      document.getElementById('admin-current-rate').textContent = (info.rate * 100).toFixed(2);
      document.getElementById('admin-current-rate-date').textContent = info.effectiveFrom;
    });
    callAuthed('listUsers', [], function (users) {
      var kids = users.filter(function (u) { return u.role === 'KID'; });
      var select = document.getElementById('admin-override-user');
      select.innerHTML = kids.map(function (k) {
        return '<option value="' + k.userId + '">' + escapeHtml(k.displayName) + '</option>';
      }).join('');
    });
  }

  function submitGlobalRate(button) {
    var rate = parseFloat(document.getElementById('admin-global-rate').value);
    var effectiveFrom = document.getElementById('admin-global-rate-date').value;
    if (isNaN(rate) || !effectiveFrom) { showError('Enter a rate and effective date.'); return; }
    callAuthed('setGlobalRate', [rate, effectiveFrom], function () {
      loadRatesTab();
      showError('Global rate updated.');
    }, null, button);
  }

  function submitRateOverride(button) {
    var userId = document.getElementById('admin-override-user').value;
    var rateStr = document.getElementById('admin-override-rate').value;
    var rate = rateStr === '' ? null : parseFloat(rateStr);
    callAuthed('setUserRateOverride', [userId, rate], function () {
      showError('Override saved.');
    }, null, button);
  }

  function loadUsersTab() {
    callAuthed('listUsers', [], function (users) {
      var rows = users.map(function (u) {
        var toggleLabel = u.status === 'ACTIVE' ? 'Disable' : 'Enable';
        var toggleStatus = u.status === 'ACTIVE' ? 'DISABLED' : 'ACTIVE';
        return '<tr><td>' + escapeHtml(u.username) + '</td><td>' + escapeHtml(u.displayName) + '</td><td>' +
          u.role + '</td><td>' + u.status + '</td><td>' +
          '<button class="secondary" onclick="toggleUserStatus(this, \'' + u.userId + '\', \'' + toggleStatus + '\')">' + toggleLabel + '</button></td></tr>';
      }).join('');
      document.getElementById('admin-users-rows').innerHTML = rows;
    });
  }

  function toggleUserStatus(button, userId, newStatus) {
    callAuthed('setUserStatus', [userId, newStatus], function () { loadUsersTab(); }, null, button);
  }

  function submitCreateAccount(button) {
    var params = {
      username: document.getElementById('admin-new-username').value.trim(),
      displayName: document.getElementById('admin-new-displayname').value.trim(),
      passcode: document.getElementById('admin-new-passcode').value,
      email: document.getElementById('admin-new-email').value.trim(),
      role: document.getElementById('admin-new-role').value
    };
    if (!params.username || !params.passcode) { showError('Username and access code are required.'); return; }

    callAuthed('createAccount', [params], function () {
      ['admin-new-username', 'admin-new-displayname', 'admin-new-passcode', 'admin-new-email'].forEach(function (id) {
        document.getElementById(id).value = '';
      });
      loadUsersTab();
      showError('Account created.');
    }, null, button);
  }
</script>
