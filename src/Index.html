<!doctype html>
<html>
<head>
  <base target="_top">
  <?!= include('Shared_CSS'); ?>
</head>
<body>
  <div class="app-shell">
    <div id="global-error-banner" class="error-banner"></div>
    <div id="top-bar" class="row hidden" style="align-items:center; margin-bottom: 12px;">
      <div style="flex: 2;">
        <strong>Family Savings</strong>
        <span class="muted" id="top-bar-name"></span>
      </div>
      <div style="flex: 0 0 auto;">
        <button class="secondary hidden" id="btn-switch-parent" onclick="handleSwitchToParentMode(this)">Switch to Parent Mode</button>
        <button class="secondary" onclick="handleLogout(this)">Log out</button>
      </div>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 id="modal-title"></h3>
      <div id="modal-body" class="modal-body hidden"></div>
      <div id="modal-fields"></div>
      <div class="modal-actions">
        <button class="secondary" onclick="modalCancel_()">Cancel</button>
        <button id="modal-confirm-btn" onclick="modalConfirm_()">Confirm</button>
      </div>
    </div>
  </div>

  <?!= include('Login'); ?>
  <?!= include('KidDashboard'); ?>
  <?!= include('AdminDashboard'); ?>

  <?!= include('Shared_JS'); ?>
  <script>
    function hideAllViews() {
      ['view-login', 'view-kid', 'view-admin'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.classList.add('hidden');
      });
    }

    function routeToDashboard() {
      var token = getToken();
      var role = getRole();
      var topBar = document.getElementById('top-bar');

      if (!token) {
        topBar.classList.add('hidden');
        showLoginView();
        return;
      }

      topBar.classList.remove('hidden');
      document.getElementById('top-bar-name').textContent = ' — ' + (getDisplayName() || '');
      document.getElementById('btn-switch-parent').classList.toggle('hidden', role === 'ADMIN');

      hideAllViews();
      if (role === 'ADMIN') {
        document.getElementById('view-admin').classList.remove('hidden');
        if (typeof loadAdminDashboard === 'function') loadAdminDashboard();
      } else {
        document.getElementById('view-kid').classList.remove('hidden');
        if (typeof loadKidDashboard === 'function') loadKidDashboard();
      }
    }

    function handleSwitchToParentMode(button) {
      showModal({
        title: 'Switch to Parent Mode',
        bodyText: 'Enter a parent/admin username and access code.',
        fields: [
          { key: 'username', label: 'Parent username', type: 'text' },
          { key: 'passcode', label: 'Parent access code', type: 'password' }
        ],
        confirmLabel: 'Switch'
      }).then(function (result) {
        if (!result.confirmed) return;
        if (!result.values.username || !result.values.passcode) { showError('Enter both fields.'); return; }

        callPublic('login', [result.values.username, result.values.passcode], function (session) {
          if (session.role !== 'ADMIN') {
            showError('That account is not a parent/admin account.');
            return;
          }
          setSession(session);
          routeToDashboard();
        }, null, button);
      });
    }

    function handleLogout(button) {
      callAuthed('logout', [], function () {
        clearSession();
        routeToDashboard();
      }, function () {
        // Even if the server call fails (e.g. already-expired session), clear locally.
        clearSession();
        routeToDashboard();
      }, button);
    }

    document.addEventListener('DOMContentLoaded', routeToDashboard);
  </script>
</body>
</html>
