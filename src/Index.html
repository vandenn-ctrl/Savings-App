<!doctype html>
<html>
<head>
  <base target="_top">
  <?!= include('Shared_CSS'); ?>
</head>
<body>
  <div class="app-shell">
    <div id="global-error-banner" class="error-banner"></div>
    <div id="top-bar" class="row hidden" style="align-items:center; margin-bottom: 12px;">
      <div class="user-badge" style="flex: 2;">
        <div id="top-bar-avatar" class="avatar-badge" onclick="handleChangeMyAvatar(this)" title="Click to change your avatar">🙂</div>
        <div>
          <div class="user-name" id="top-bar-name" onclick="goToHome()" style="cursor:pointer; display:inline-block;" title="Go to home"></div>
          <span id="top-bar-history-icon" class="hidden" onclick="kidShowTab('history')" title="View history" style="cursor:pointer; margin-left:8px; font-size:16px;">🕒</span>
          <br>
          <span class="top-bar-role-pill" id="top-bar-role"></span>
        </div>
      </div>
    </div>
    <div id="view-as-banner" class="hidden">
      <span>👁️ Viewing as a child</span>
      <button class="secondary" onclick="exitViewAsChild()">Back to parent</button>
    </div>
  </div>

  <div id="version-info-badge" onclick="showVersionInfo()" title="What's new">i</div>

  <div id="fab-backdrop" onclick="closeFabMenu()"></div>
  <div id="fab-quick-actions" class="hidden">
    <button class="fab-quick-btn" onclick="goToApprovals()" title="Approvals">✓<span id="fab-approvals-badge" class="fab-badge hidden"></span></button>
    <button class="fab-quick-btn" onclick="goToNewTransaction(this)" title="New transaction">+/&minus;</button>
  </div>
  <div id="fab-root" class="hidden">
    <div id="fab-items"></div>
    <button id="fab-toggle" onclick="toggleFabMenu()" title="Menu">☰</button>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 id="modal-title"></h3>
      <div id="modal-body" class="modal-body hidden"></div>
      <div id="modal-fields"></div>
      <div class="modal-actions">
        <button class="secondary" onclick="modalCancel_()">Cancel</button>
        <button id="modal-confirm-btn" onclick="modalConfirm_()">Confirm</button>
      </div>
    </div>
  </div>

  <?!= include('Login'); ?>
  <?!= include('KidDashboard'); ?>
  <?!= include('AdminDashboard'); ?>

  <?!= include('Shared_JS'); ?>
  <script>
    function hideAllViews() {
      ['view-login', 'view-kid', 'view-admin'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.classList.add('hidden');
      });
    }

    function routeToDashboard() {
      var token = getToken();
      var role = getRole();
      var topBar = document.getElementById('top-bar');
      var fabRoot = document.getElementById('fab-root');
      var fabQuickActions = document.getElementById('fab-quick-actions');

      if (!token) {
        topBar.classList.add('hidden');
        fabRoot.classList.add('hidden');
        fabQuickActions.classList.add('hidden');
        closeFabMenu();
        showLoginView();
        return;
      }

      topBar.classList.remove('hidden');
      fabRoot.classList.remove('hidden');
      fabQuickActions.classList.toggle('hidden', role !== 'ADMIN');
      document.getElementById('view-as-banner').classList.toggle('hidden', !getViewAsReturn_());
      applyTheme(getTheme());
      document.getElementById('top-bar-avatar').textContent = getAvatar();
      document.getElementById('top-bar-name').textContent = getDisplayName() || '';
      var roleEl = document.getElementById('top-bar-role');
      roleEl.textContent = role === 'ADMIN' ? 'Parent / Admin' : 'Kid';
      roleEl.className = 'top-bar-role-pill role-' + role;
      document.getElementById('top-bar-history-icon').classList.toggle('hidden', role !== 'KID');

      hideAllViews();
      _fabActiveTab = 'overview';
      if (role === 'ADMIN') {
        document.getElementById('view-admin').classList.remove('hidden');
        if (typeof loadAdminDashboard === 'function') loadAdminDashboard();
      } else {
        document.getElementById('view-kid').classList.remove('hidden');
        if (typeof loadKidDashboard === 'function') loadKidDashboard();
      }
    }

    function handleChangeMyAvatar(button) {
      showModal({
        title: 'Set your avatar',
        bodyText: 'Pick an emoji to represent you (e.g. 🦊 👧 👦 🚀 ⚽).',
        fields: [{ key: 'avatar', label: 'Emoji', placeholder: getAvatar() }],
        confirmLabel: 'Save'
      }).then(function (result) {
        if (!result.confirmed || !result.values.avatar) return;
        callAuthed('setMyAvatar', [result.values.avatar], function (updated) {
          setAvatar(updated.avatar);
          document.getElementById('top-bar-avatar').textContent = updated.avatar;
        }, null, button);
      });
    }

    function handleCustomizeTheme(button) {
      var current = {};
      try { current = getTheme() ? JSON.parse(getTheme()) : {}; } catch (e) { current = {}; }

      showModal({
        title: 'Customize your theme',
        bodyText: 'Pick your own accent color and background. This only changes how the app looks for you.',
        fields: [
          { key: 'accent', label: 'Accent color', type: 'color', value: current.accent || '#2f6f4f' },
          {
            key: 'bgMode', label: 'Background style', type: 'select', value: current.bgMode || 'solid',
            options: [
              { value: 'solid', label: 'Solid color' },
              { value: 'gradient', label: 'Gradient' }
            ]
          },
          { key: 'bgFrom', label: 'Background color', type: 'color', value: current.bgFrom || '#f4f6f8' },
          {
            key: 'bgTo', label: 'Gradient second color', type: 'color', value: current.bgTo || '#dbe6e0',
            showWhen: { key: 'bgMode', values: ['gradient'] }
          },
          {
            key: 'showTabLabels', label: 'Tab buttons', type: 'select',
            value: current.showTabLabels ? '1' : '0',
            options: [
              { value: '0', label: 'Icons only' },
              { value: '1', label: 'Icons + text labels' }
            ]
          }
        ],
        confirmLabel: 'Save theme'
      }).then(function (result) {
        if (!result.confirmed) return;
        var theme = {
          accent: result.values.accent,
          bgMode: result.values.bgMode,
          bgFrom: result.values.bgFrom,
          bgTo: result.values.bgTo,
          showTabLabels: result.values.showTabLabels === '1'
        };
        var themeStr = JSON.stringify(theme);
        callAuthed('setMyTheme', [themeStr], function () {
          setTheme(themeStr);
        }, null, button);
      });
    }

    function handleSwitchUser(button) {
      showModal({
        title: 'Switch User',
        bodyText: 'Enter a username and access code to switch to that account.',
        fields: [
          { key: 'username', label: 'Username', type: 'text' },
          { key: 'passcode', label: 'Access code', type: 'password' }
        ],
        confirmLabel: 'Switch'
      }).then(function (result) {
        if (!result.confirmed) return;
        if (!result.values.username || !result.values.passcode) { showError('Enter both fields.'); return; }

        callPublic('login', [result.values.username, result.values.passcode], function (session) {
          setSession(session);
          routeToDashboard();
        }, null, button);
      });
    }

    /** localStorage key holding the admin's own session while previewing a kid's account, so "Back to parent" doesn't need re-login. */
    var VIEW_AS_RETURN_KEY_ = 'fs_view_as_return';

    function getViewAsReturn_() {
      try { return JSON.parse(localStorage.getItem(VIEW_AS_RETURN_KEY_) || 'null'); } catch (e) { return null; }
    }

    /** Admin-only: preview any kid's account exactly as they see it, without needing their access code. */
    function handleViewAsChild(button) {
      callAuthed('listUsers', [], function (users) {
        var kids = users.filter(function (u) { return u.role === 'KID'; });
        if (kids.length === 0) { showError('No kids to view yet.'); return; }

        showModal({
          title: 'View as child',
          bodyText: 'See exactly what this child sees. You can switch back to your own account anytime.',
          fields: [{
            key: 'targetUser', label: 'Child', type: 'select',
            options: kids.map(function (k) { return { value: k.userId, label: (k.avatar || '🙂') + ' ' + k.displayName }; })
          }],
          confirmLabel: 'View'
        }).then(function (result) {
          if (!result.confirmed) return;

          callAuthed('adminViewAsUser', [result.values.targetUser], function (session) {
            localStorage.setItem(VIEW_AS_RETURN_KEY_, JSON.stringify({
              token: getToken(), role: getRole(), displayName: getDisplayName(), avatar: getAvatar(), theme: getTheme()
            }));
            setSession(session);
            routeToDashboard();
          }, null, button);
        });
      });
    }

    /** Switches back to the stashed admin session, revoking the temporary "view as" session. */
    function exitViewAsChild() {
      var adminSession = getViewAsReturn_();
      if (!adminSession) return;
      var viewAsToken = getToken();
      localStorage.removeItem(VIEW_AS_RETURN_KEY_);
      setSession(adminSession);
      routeToDashboard();
      callPublic('logout', [viewAsToken], function () {}, function () {});
    }

    function handleLogout(button) {
      callAuthed('logout', [], function () {
        clearSession();
        routeToDashboard();
      }, function () {
        // Even if the server call fails (e.g. already-expired session), clear locally.
        clearSession();
        routeToDashboard();
      }, button);
    }

    // --- Floating spiral menu (replaces the old top tab bar + action buttons) ---
    var _fabActiveTab = 'overview';
    var _fabMenuLevel = 'main'; // 'main' (the tabs) or 'more' (account/utility actions)

    /** Clicking your own name in the top bar goes home -- takes Home's spot off the spiral. */
    function goToHome() {
      var role = getRole();
      _fabActiveTab = 'overview';
      if (role === 'ADMIN') {
        adminShowTab('overview');
      } else {
        kidShowTab('overview');
      }
    }

    /** Admin's Approve and Transactions are fixed quick-buttons instead (see #fab-quick-actions), so the spiral is just this flat "everything else" list -- no More sub-level needed. */
    function fabAdminMenuItems_() {
      return [
        { key: 'kids', icon: '👨‍👩‍👧‍👦', label: 'Kids', action: function () { adminShowTab('kids'); } },
        { key: 'viewas', icon: '👁️', label: 'View as child', action: handleViewAsChild },
        { key: 'rates', icon: '💹', label: 'Rates', action: function () { adminShowTab('rates'); } },
        { key: 'users', icon: '👤', label: 'Users', action: function () { adminShowTab('users'); } },
        { key: 'manage', icon: '🛠️', label: 'Manage', action: function () { adminShowTab('manage'); } },
        { key: 'communicate', icon: '💬', label: 'Communicate', action: function () { adminShowTab('communicate'); } },
        { key: 'setup', icon: '⚙️', label: 'Setup', action: function () { adminShowTab('setup'); } },
        { key: 'switch', icon: '🔀', label: 'Switch User', action: handleSwitchUser },
        { key: 'logout', icon: '🚪', label: 'Log out', action: handleLogout }
      ];
    }

    /** Kid's most-used actions -- these stay directly on the spiral. */
    function fabTabItems_() {
      return [
        { key: 'invest', icon: '📈', label: 'Investments', action: function () { kidShowTab('invest'); } },
        { key: 'history', icon: '🕒', label: 'History', action: function () { kidShowTab('history'); } }
      ];
    }

    /** Everything else for a kid -- tucked behind the "More" item instead of cluttering the main spiral. */
    function fabMoreItems_() {
      return [
        { key: 'settings', icon: '🔧', label: 'Settings', action: function () { kidShowTab('settings'); } },
        { key: 'theme', icon: '⚙️', label: 'Theme', action: handleCustomizeTheme },
        { key: 'switch', icon: '🔀', label: 'Switch User', action: handleSwitchUser },
        { key: 'logout', icon: '🚪', label: 'Log out', action: handleLogout }
      ];
    }

    function fabMenuItems_() {
      if (getRole() === 'ADMIN') return fabAdminMenuItems_();

      if (_fabMenuLevel === 'more') {
        return [{ key: '__back', icon: '⬅️', label: 'Back', action: function () { _fabMenuLevel = 'main'; renderFabMenu(); } }]
          .concat(fabMoreItems_());
      }
      return fabTabItems_().concat([{ key: '__more', icon: '⋯', label: 'More', action: function () { _fabMenuLevel = 'more'; renderFabMenu(); } }]);
    }

    var _fabTabKeys = ['kids', 'rates', 'users', 'setup', 'manage', 'communicate', 'invest', 'history', 'settings'];

    function goToApprovals() {
      adminShowTab('approvals');
    }

    function goToNewTransaction(button) {
      if (typeof openNewTransactionModal === 'function') openNewTransactionModal(button);
    }

    /** Puts a pending-approval count on the ✓ quick-button so it signals there's something to review, not just a static icon. */
    function refreshApprovalsBadge() {
      callAuthed('listPendingTransactions', [], function (pending) {
        var badge = document.getElementById('fab-approvals-badge');
        if (!badge) return;
        if (pending.length > 0) {
          badge.textContent = pending.length > 99 ? '99+' : String(pending.length);
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      });
    }

    /**
     * Positions each item along a spiral (growing angle + radius) fanning
     * up-and-left from the FAB. Sweep is capped at 75° -- the FAB sits near
     * the bottom-right corner, so the arc must stay within "straight up" to
     * "upper-left"; going further toward "left" or beyond starts adding a
     * downward component that would push later (larger-radius) items off
     * the bottom of the screen.
     */
    function renderFabMenu() {
      var items = fabMenuItems_();
      var baseRadius = 72, radiusStep = 28, sweepDeg = 75;
      document.getElementById('fab-items').innerHTML = items.map(function (item, i) {
        var t = items.length > 1 ? i / (items.length - 1) : 0;
        var theta = (-t * sweepDeg) * Math.PI / 180;
        var radius = baseRadius + i * radiusStep;
        var dx = (Math.sin(theta) * radius).toFixed(1);
        var dy = (-Math.cos(theta) * radius).toFixed(1);
        var activeClass = (item.key === _fabActiveTab) ? ' active' : '';
        return '<button class="fab-item' + activeClass + '" style="--dx:' + dx + 'px; --dy:' + dy + 'px;" ' +
          'title="' + escapeHtml(item.label) + '" onclick="handleFabItemClick(' + i + ', this)">' + item.icon + '</button>';
      }).join('');
    }

    function handleFabItemClick(index, btn) {
      var item = fabMenuItems_()[index];
      if (!item) return;
      if (item.key === '__more' || item.key === '__back') {
        item.action();
        return;
      }
      if (_fabTabKeys.indexOf(item.key) !== -1) _fabActiveTab = item.key;
      closeFabMenu();
      item.action(btn);
    }

    function toggleFabMenu() {
      if (document.body.classList.contains('fab-menu-open')) {
        closeFabMenu();
      } else {
        renderFabMenu();
        // Force layout so the freshly-created items' initial (closed) state
        // paints before the class toggle -- otherwise the browser collapses
        // both states into one frame and the fan-out never animates.
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            document.body.classList.add('fab-menu-open');
          });
        });
      }
    }

    function closeFabMenu() {
      document.body.classList.remove('fab-menu-open');
      _fabMenuLevel = 'main';
    }

    document.addEventListener('DOMContentLoaded', routeToDashboard);
  </script>
</body>
</html>
